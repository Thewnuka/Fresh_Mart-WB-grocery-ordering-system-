# ============================================================
# Application
# ============================================================
spring.application.name=supermarket-ordering-system
server.port=8080

# ============================================================
# MySQL database connection
# The real username and password are NOT stored here.
# Put them in "local.properties" in the project folder (that file is not
# committed to Git), for example:
#     spring.datasource.username=root
#     spring.datasource.password=your_mysql_password
# ============================================================
spring.config.import=optional:file:./local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/supermarket_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# Tables are created manually from database/supermarket_db.sql
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
