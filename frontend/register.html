<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <title>FreshMart Admin - Sign Up</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="register-page">
        <div class="container">
            <div class="register-card mx-auto">

                <div class="text-center">
                    <img src="/logo.svg" alt="FreshMart logo" class="register-logo">
                    <h1 class="register-brand">FreshMart</h1>
                    <p class="register-subtitle">Supermarket Ordering System</p>
                </div>

                <h2 class="register-title">Create Admin Account</h2>

                <div id="register-error" class="alert alert-danger register-error" hidden></div>

                <!-- novalidate: our own JavaScript checks show the error messages -->
                <form id="register-form" novalidate>
                    <div class="mb-3">
                        <label for="fullName" class="form-label register-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control register-input"
                               placeholder="John Perera" maxlength="100" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label register-label">Email</label>
                        <input type="email" id="email" class="form-control register-input"
                               placeholder="admin@example.com" maxlength="150" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label register-label">Password</label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control register-input"
                                   placeholder="At least 6 characters" required>
                            <button type="button" class="btn register-eye-button" data-password-for="password"
                                    aria-label="Show password">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                                    <circle cx="12" cy="12" r="3" />
                                    <line x1="3" y1="3" x2="21" y2="21" style="display: none" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label register-label">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" class="form-control register-input"
                                   placeholder="Re-enter your password" required>
                            <button type="button" class="btn register-eye-button" data-password-for="confirmPassword"
                                    aria-label="Show password">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                                    <circle cx="12" cy="12" r="3" />
                                    <line x1="3" y1="3" x2="21" y2="21" style="display: none" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="register-button" class="btn register-button">Sign Up</button>
                </form>

                <p class="register-switch-text">
                    Already have an account?
                    <a href="login.html" class="register-switch-link">Login</a>
                </p>

            </div>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
