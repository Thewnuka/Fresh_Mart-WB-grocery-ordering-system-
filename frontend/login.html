<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <title>FreshMart Admin - Login</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="container">
            <div class="login-card mx-auto">

                <div class="text-center">
                    <img src="/logo.svg" alt="FreshMart logo" class="login-logo">
                    <h1 class="login-brand">FreshMart</h1>
                    <p class="login-subtitle">Supermarket Ordering System</p>
                </div>

                <h2 class="login-title">Admin Login</h2>

                <div id="login-success" class="alert alert-success login-success" hidden></div>
                <div id="login-error" class="alert alert-danger login-error" hidden></div>

                <!-- novalidate: our own JavaScript checks show the error messages -->
                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label login-label">Email</label>
                        <input type="email" id="email" class="form-control login-input"
                               placeholder="admin@example.com" maxlength="150" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label login-label">Password</label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control login-input"
                                   placeholder="Enter your password" required>
                            <button type="button" class="btn login-eye-button" data-password-for="password"
                                    aria-label="Show password">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                                    <circle cx="12" cy="12" r="3" />
                                    <line x1="3" y1="3" x2="21" y2="21" style="display: none" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-button" class="btn login-button">Login</button>
                </form>

                <p class="login-switch-text">
                    Don't have an account?
                    <a href="register.html" class="login-switch-link">Sign Up</a>
                </p>

            </div>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
